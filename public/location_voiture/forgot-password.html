<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js"></script>
</head>
<body>
    <header>
        <div id="header-content">
            <span id="site-name">LOCAVO</span>
            <!-- Menu dynamique en fonction du type d'utilisateur -->
            <nav>
                <ul id="menu">
                    <!-- Le contenu du menu sera généré dynamiquement par JavaScript -->
                </ul>
            </nav>
        </div>
    </header>

    <div id="forgot-password-form">
        <h1>Mot de passe oublié</h1>
        <form id="forgot-password-form">
            <label for="email">Adresse email :</label>
            <input type="email" id="email" name="email" required>

            <button type="submit">Réinitialiser le mot de passe</button>
        </form>

        <p><a href="login.html">Retour à la  page de connexion</a></p>
    </div>

    <footer>
        <!-- Pied de page commun à toutes les pages -->
        <p>&copy; 2024 <strong>LOCAVO</strong></p>
    </footer>

</body>
</html>

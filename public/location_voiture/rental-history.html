<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique des Locations</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js"></script>
</head>
<body>

    <header>
        <div id="header-content">
            <span id="site-name">LOCAVO</span>
            <nav>
                <ul id="menu">
                    <!-- Le contenu du menu sera généré dynamiquement par JavaScript -->
                </ul>
            </nav>
        </div>
    </header>

    <section id="rental-history">
        <h2>Historique des Locations</h2>
        <p>Consultez ci-dessous l'historique de vos locations passées.</p>

        <!-- Tableau d'Historique des Locations -->
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Modèle de Voiture</th>
                    <th>Durée de Location</th>
                    <th>Coût Total</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Les données du tableau seront générées dynamiquement par JavaScript -->
            </tbody>
        </table>

        <!-- Messages d'Information -->
        <div id="info-message">
            <!-- Les messages informatifs seront générés dynamiquement par JavaScript -->
        </div>
    </section>

    <footer>
        <p>&copy; 2024 <strong>LOCAVO</strong></p>
    </footer>

    <script src="main.js"></script>
</body>
</html>

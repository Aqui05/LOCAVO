<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement</title>
    <link rel="stylesheet" href="payment.css">
    <script src="payment.js"></script>
</head>
<body>

    <div class="container">
        <h2>Page de Paiement</h2>
        
        <!-- Informations du client (peuvent être pré-remplies si l'utilisateur est connecté) -->
        <div class="customer-info">
            <h3>Informations du Client</h3>
            <!-- Ajoutez des champs pour les informations du client ici -->
        </div>
        
        <!-- Options de Paiement -->
        <div class="payment-options">
            <h3>Options de Paiement</h3>
            <!-- Ajoutez des champs pour les options de paiement (carte de crédit, PayPal, etc.) ici -->
        </div>

        <!-- Récapitulatif de la Location -->
        <div class="rental-summary">
            <h3>Récapitulatif de la Location</h3>
            <!-- Affichez un récapitulatif de la location ici -->
        </div>

        <!-- Bouton de Paiement -->
        <button id="payment-button">Payer</button>
    </div>

    <script src="payment.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Locations de Voitures</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js"></script>
</head>
<body>
    <header>
        <div id="header-content">
            <span id="site-name">LOCAVO</span>
            <nav>
                <ul id="menu">
                    <!-- Le contenu du menu sera généré dynamiquement par JavaScript -->
                </ul>
            </nav>
        </div>
    </header>
    <section id="userLists">
    <h1>Liste des Utilisateurs ayant Effectué des Locations</h1>
    <section id="userList">
        <!-- Affichez ici la liste complète des utilisateurs et leurs détails -->
    </section>

    <h1>Consultation des Détails des Transactions</h1>
    <section id="transactionDetails">
        <!-- Affichez ici les détails spécifiques de chaque transaction -->
    </section>

    <h1>Actions Liées aux Locations</h1>
    <section id="locationActions">
        <!-- Affichez ici les actions en rapport avec les locations (modification, annulation, gestion des problèmes) -->
    </section>

    <h1>Statut des Locations</h1>
    <section id="locationStatus">
        <!-- Affichez ici le statut actuel de chaque location -->
    </section>

    <h1>Filtrage et Recherche</h1>
    <section id="filterAndSearch">
        <!-- Ajoutez ici des fonctionnalités de filtrage et de recherche -->
    </section>
</section>


<footer>
    <p>&copy; 2024 <strong>LOCAVO</strong></p>
</footer>

</body>
</html>
